<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Ejecutivo BQS</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%230b4f9e%22/><text y=%2268%22 x=%2212%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 font-family=%22sans-serif%22>BQS</text></svg>">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- HTML2PDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bqs: {
              DEFAULT: '#0b4f9e',
              hover: '#08407f',
              soft: '#eaf2fb'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-900" x-data="bqsApp" x-init="init()" x-cloak>

  <!-- PANTALLA DE LOGIN -->
  <template x-if="!isLoggedIn">
    <div class="flex min-h-screen bg-slate-50">
      <!-- PANEL IZQUIERDO: Branding & Info -->
      <div class="hidden lg:flex lg:w-1/2 flex-col justify-between bg-gradient-to-br from-[#0a488f] via-[#0b4f9e] to-[#062c5b] text-white p-16 relative overflow-hidden">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
          <span class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 text-white text-base font-bold tracking-wider border border-white/20">BQS</span>
          <div>
            <p class="font-bold text-base leading-tight">Portal Ejecutivo BQS</p>
            <p class="text-xs text-blue-200">by Dataholics</p>
          </div>
        </div>

        <!-- Headline & Features -->
        <div class="max-w-md my-auto space-y-12">
          <div class="space-y-4">
            <h2 class="text-4xl font-bold tracking-tight leading-tight">Tu información financiera, consolidada y bajo control.</h2>
            <p class="text-blue-100 text-base leading-relaxed">El portal de lectura de la Dirección General: del dato disperso a una sola fuente de verdad.</p>
          </div>

          <div class="space-y-6">
            <!-- Feature 1 -->
            <div class="flex gap-4">
              <span class="p-2.5 h-10 w-10 shrink-0 rounded-xl bg-white/10 flex items-center justify-center border border-white/10 text-white">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" /></svg>
              </span>
              <div>
                <h4 class="font-semibold text-sm">Las tres preguntas, al instante</h4>
                <p class="text-xs text-blue-100 mt-0.5">Qué se facturó, qué falta por facturar y cuánto te deben — en un solo vistazo.</p>
              </div>
            </div>

            <!-- Feature 2 -->
            <div class="flex gap-4">
              <span class="p-2.5 h-10 w-10 shrink-0 rounded-xl bg-white/10 flex items-center justify-center border border-white/10 text-white">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M12 16v1" /></svg>
              </span>
              <div>
                <h4 class="font-semibold text-sm">Ciclo de cobro completo</h4>
                <p class="text-xs text-blue-100 mt-0.5">Del devengado a la factura y al pago, con reglas y trazabilidad de extremo a extremo.</p>
              </div>
            </div>

            <!-- Feature 3 -->
            <div class="flex gap-4">
              <span class="p-2.5 h-10 w-10 shrink-0 rounded-xl bg-white/10 flex items-center justify-center border border-white/10 text-white">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
              </span>
              <div>
                <h4 class="font-semibold text-sm">Seguridad por diseño</h4>
                <p class="text-xs text-blue-100 mt-0.5">Whitelist de accesos y perfil de Dirección en estricta solo lectura.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between text-xs text-blue-200">
          <span class="flex items-center gap-1.5"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg> Dirección en solo lectura</span>
          <span class="flex items-center gap-1.5"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg> Demo · datos simulados</span>
        </div>
      </div>

      <!-- PANEL DERECHO: Formulario de Login -->
      <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-slate-50">
        <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-10 shadow-sm space-y-8">
          <!-- Semillas de Base de Datos -->
          <div class="flex gap-4 pb-4 border-b border-slate-100">
            <button @click="seedDatabase()" class="flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 py-2.5 px-4 text-xs font-semibold text-indigo-700 transition duration-150">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
              Generar Seed
            </button>
            <button @click="clearDatabase()" class="flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-red-50 hover:bg-red-100 py-2.5 px-4 text-xs font-semibold text-red-600 transition duration-150">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
              Borrar Seed
            </button>
          </div>

          <div>
            <h3 class="text-2xl font-bold text-slate-900">Iniciar sesión</h3>
            <p class="text-sm text-slate-500 mt-1">Ingresa con tu correo authorized para continuar.</p>
          </div>

          <form class="space-y-6" @submit.prevent="handleLogin()">
            <div class="space-y-2">
              <label for="email" class="block text-sm font-semibold text-slate-700">Correo</label>
              <input id="email" x-model="loginEmail" type="email" required placeholder="admin@bestqualitysolutions.com" class="block w-full rounded-xl border border-slate-200 bg-white py-3 px-4 text-slate-900 focus:outline-none focus:border-bqs focus:ring-2 focus:ring-bqs/10 sm:text-sm">
            </div>

            <div class="space-y-2">
              <label for="password" class="block text-sm font-semibold text-slate-700">Contraseña</label>
              <input id="password" type="password" value="password" disabled class="block w-full rounded-xl border border-slate-200 bg-slate-50 py-3 px-4 text-slate-400 font-mono tracking-widest sm:text-sm">
              <p class="text-xs text-slate-400 mt-1">En el demo la contraseña no se valida.</p>
            </div>

            <template x-if="loginError">
              <div class="rounded-xl bg-red-50 border border-red-200 p-4 text-xs text-red-600" x-text="loginError"></div>
            </template>

            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-bqs hover:bg-bqs-hover py-3 text-sm font-semibold text-white shadow-sm transition duration-150">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
              Iniciar sesión
            </button>
          </form>

          <!-- Acceso rápido -->
          <div class="pt-6 border-t border-slate-100 space-y-3">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Acceso Rápido por Rol</span>
            <div class="grid grid-cols-1 gap-2">
              <button @click="loginEmail = 'admin@bestqualitysolutions.com'" class="flex items-center justify-between text-left p-3.5 rounded-xl border border-slate-100 hover:bg-slate-50 transition duration-150">
                <div>
                  <span class="text-xs font-bold text-slate-700 block">Admin Dataholics</span>
                  <span class="text-[11px] text-slate-400 block mt-0.5">Ve todo el sistema</span>
                </div>
                <span class="text-xs font-semibold text-slate-400" style="font-family: monospace;">admin@bestqualitysolutions.com</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>


  <!-- PORTAL PRINCIPAL (SPA) -->
  <template x-if="isLoggedIn">
    <div class="flex h-screen overflow-hidden">
      <!-- SIDEBAR (Colapsable BQS-003) -->
      <aside :class="isSidebarCollapsed ? 'w-0 border-r-0' : 'w-64 border-r border-slate-200'" class="bg-white flex flex-col h-full flex-shrink-0 transition-all duration-300 overflow-hidden">
        <div class="h-16 flex items-center gap-3 border-b border-slate-200 px-6 flex-shrink-0">
          <span class="w-9 h-9 flex items-center justify-center rounded-lg bg-bqs text-white text-sm font-bold tracking-wider">BQS</span>
          <div>
            <p class="font-semibold text-sm text-slate-900 leading-tight">Portal Ejecutivo</p>
            <p class="text-xs text-slate-500">by Dataholics</p>
          </div>
        </div>

        <nav class="flex-1 p-4 space-y-6 overflow-y-auto">
          <!-- Grupo Dirección -->
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Dirección</p>
            <div class="space-y-1">
              <button @click="navigate('resumen')" :class="activePage === 'resumen' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                Resumen / Charts
              </button>
              <button @click="navigate('super_captura')" :class="activePage === 'super_captura' ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                Super Captura Wizard
              </button>
              <button @click="navigate('porfacturar')" :class="activePage === 'porfacturar' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Por Facturar
              </button>
              <button @click="navigate('porcobrar')" :class="activePage === 'porcobrar' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
                Por Cobrar
              </button>
              <button @click="navigate('reportes')" :class="activePage === 'reportes' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                Reportes Ejecutivo
              </button>
            </div>
          </div>

          <!-- Grupo Operación -->
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Catálogos & Operación</p>
            <div class="space-y-1">
              <button @click="navigate('clientes')" :class="activePage === 'clientes' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                Clientes (UID)
              </button>
              <button @click="navigate('cotizaciones')" :class="activePage === 'cotizaciones' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                Cotizaciones (Evidencia)
              </button>
              <button @click="navigate('devengado')" :class="activePage === 'devengado' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
                Devengado (Sorteos)
              </button>
              <button @click="navigate('facturas')" :class="activePage === 'facturas' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                Facturas
              </button>
              <button @click="navigate('pagos')" :class="activePage === 'pagos' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M12 16v1" /></svg>
                Pagos / Abonos
              </button>
            </div>
          </div>

          <!-- Grupo Administración -->
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Administración</p>
            <div class="space-y-1">
              <button @click="navigate('migracion')" :class="activePage === 'migracion' ? 'bg-red-50 text-red-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                Facturas en el Aire (Audit)
              </button>
              <button @click="navigate('importar')" :class="activePage === 'importar' ? 'bg-bqs-soft text-bqs font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg transition duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                Importar & Conciliar
              </button>
            </div>
          </div>
        </nav>

        <div class="p-4 border-t border-slate-200">
          <button @click="handleLogout()" class="w-full flex items-center justify-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50 hover:border-red-100 transition duration-150">
            Cerrar Sesión
          </button>
        </div>
      </aside>

      <!-- SECCIÓN PRINCIPAL -->
      <div class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-hidden">
        <!-- TOPBAR -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0">
          <div class="flex items-center">
            <!-- BOTÓN COLLAPSE SIDEBAR (BQS-003) -->
            <button @click="toggleSidebar()" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 focus:outline-none mr-4" aria-label="Toggle Sidebar">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <h1 class="text-lg font-bold text-slate-800" x-text="getPageTitle()"></h1>
          </div>
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-full bg-bqs flex items-center justify-center text-white text-xs font-semibold" x-text="getUserInitials()"></span>
            <div class="text-left leading-tight hidden sm:block">
              <p class="text-sm font-semibold text-slate-900" x-text="userRole === 'owner' ? 'Eric (Director General)' : 'Administrador'"></p>
              <p class="text-xs text-slate-500" x-text="userEmail"></p>
            </div>
          </div>
        </header>

        <!-- CONTENIDO VIVO -->
        <main class="flex-1 overflow-y-auto p-8">

      <h3 class="text-xl font-bold text-slate-900" x-text="isEdit ? 'Editar Factura' : 'Registrar Factura'"></h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700">Folio de Factura</label>
          <input type="text" x-model="facturaForm.Folio_Factura" :disabled="isEdit" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none" placeholder="F-6082">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">UUID CFDI (SAT)</label>
          <input type="text" x-model="facturaForm.cfdiUUID" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 font-mono focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Cliente</label>
          <select x-model="facturaForm.ID_Cliente" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
            <option value="">Selecciona Cliente...</option>
            <template x-for="c in clientes">
              <option :value="c.ID_Cliente" x-text="c.Nombre_Comercial"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Fecha Emisión</label>
          <input type="date" x-model="facturaForm.Fecha_Emision" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Monto Subtotal</label>
          <input type="number" step="0.01" x-model="facturaForm.Monto_Subtotal" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 font-mono focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Monto Total</label>
          <input type="number" step="0.01" x-model="facturaForm.Monto_Total" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 font-mono focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Moneda</label>
          <select x-model="facturaForm.Moneda" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
            <option value="Peso Mexicano">Peso Mexicano</option>
            <option value="Dolar americano">Dolar americano</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Fecha Vencimiento</label>
          <input type="date" x-model="facturaForm.Fecha_Vencimiento" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Estatus de Pago</label>
          <select x-model="facturaForm.Estatus_Pago" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
            <option value="Vigente">Vigente</option>
            <option value="Pagada">Pagada</option>
            <option value="Vencida">Vencida</option>
            <option value="Pago Parcial">Pago Parcial</option>
          </select>
        </div>
      </div>

      <template x-if="crudError">
        <div class="rounded-xl bg-red-50 border border-red-200 p-4 text-xs text-red-600" x-text="crudError"></div>
      </template>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button @click="showModal = null" class="rounded-xl border border-slate-200 py-2 px-4 text-sm font-semibold text-slate-600 hover:bg-slate-50">Cancelar</button>
        <button @click="saveItem('factura')" class="rounded-xl bg-bqs hover:bg-bqs-hover py-2 px-5 text-sm font-semibold text-white">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: PAGO / ABONO -->
  <div x-show="showModal === 'pago'" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm" style="display: none;">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 border border-slate-200 shadow-xl space-y-6">
      <h3 class="text-xl font-bold text-slate-900" x-text="isEdit ? 'Editar Pago' : 'Registrar Pago / Abono'"></h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700">ID Pago</label>
          <input type="text" x-model="pagoForm.ID_Pago" :disabled="isEdit" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none" placeholder="PAG-0001">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Factura Relacionada</label>
          <select x-model="pagoForm.Folio_Factura" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
            <option value="">Selecciona Factura...</option>
            <template x-for="f in facturasData">
              <option :value="f.Folio_Factura" x-text="f.Folio_Factura + ' (' + f.Cliente + ')'"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Fecha Pago</label>
          <input type="date" x-model="pagoForm.Fecha_Pago" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Monto Pagado</label>
          <input type="number" step="0.01" x-model="pagoForm.Monto_Pagado" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 font-mono focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700">Referencia / Observaciones</label>
          <input type="text" x-model="pagoForm.Referencia" class="block w-full rounded-xl border border-slate-200 py-2.5 px-4 text-sm mt-1 focus:outline-none">
        </div>
      </div>

      <template x-if="crudError">
        <div class="rounded-xl bg-red-50 border border-red-200 p-4 text-xs text-red-600" x-text="crudError"></div>
      </template>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button @click="showModal = null" class="rounded-xl border border-slate-200 py-2 px-4 text-sm font-semibold text-slate-600 hover:bg-slate-50">Cancelar</button>
        <button @click="saveItem('pago')" class="rounded-xl bg-bqs hover:bg-bqs-hover py-2 px-5 text-sm font-semibold text-white">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Contenedor Oculto para Generación de PDF de Cotizaciones -->
  <div style="display: none;">
    <div id="quote-pdf-template" style="padding: 20px; font-family: sans-serif; color: #334155; font-size: 13px;" x-if="selectedQuoteForPDF">
      <template x-if="selectedQuoteForPDF">
        <div style="padding: 10px;">
          <!-- Header -->
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px;">
            <div>
              <h1 style="font-size: 22px; font-weight: bold; color: #1e293b; margin: 0;">Best Quality Solutions</h1>
              <p style="margin: 3px 0 0 0; font-size: 11px; color: #64748b;">S.A. de C.V. | RFC: BQS120813DF5</p>
              <p style="margin: 2px 0 0 0; font-size: 11px; color: #64748b;">Servicios de Calidad, Sorteo e Inspección de Componentes</p>
            </div>
            <div style="text-align: right;">
              <h2 style="font-size: 16px; font-weight: bold; color: #4338ca; margin: 0;">COTIZACIÓN / REMISIÓN</h2>
              <p style="margin: 4px 0 0 0; font-size: 14px; font-weight: bold; font-family: monospace; color: #1e293b;" x-text="selectedQuoteForPDF.ID_Cotizacion"></p>
              <template x-if="selectedQuoteForPDF.Numero_Remision">
                <p style="margin: 2px 0 0 0; font-size: 11px; font-weight: bold; color: #0f766e; font-family: monospace;" x-text="'Remisión: ' + selectedQuoteForPDF.Numero_Remision"></p>
              </template>
              <p style="margin: 2px 0 0 0; font-size: 10px; color: #64748b;" x-text="'Fecha: ' + new Date().toLocaleDateString()"></p>
            </div>
          </div>

          <!-- Info columns -->
          <div style="display: flex; justify-content: space-between; margin-bottom: 25px; gap: 20px;">
            <div style="flex: 1; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px;">
              <h3 style="margin-top: 0; font-size: 12px; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px;">Cliente</h3>
              <p style="margin: 4px 0; font-weight: bold;" x-text="selectedQuoteForPDFClient.Nombre_Fiscal || selectedQuoteForPDFClient.Nombre_Comercial"></p>
              <p style="margin: 2px 0; font-size: 11px;" x-text="'RFC: ' + selectedQuoteForPDFClient.RFC"></p>
              <p style="margin: 2px 0; font-size: 11px;" x-text="'Dirección: ' + (selectedQuoteForPDFClient.Direccion || 'N/A')"></p>
              <p style="margin: 2px 0; font-size: 11px;" x-text="'C.P.: ' + (selectedQuoteForPDFClient.CP || 'N/A')"></p>
            </div>
            <div style="flex: 1; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px;">
              <h3 style="margin-top: 0; font-size: 12px; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px;">Detalles de la Oferta</h3>
              <p style="margin: 4px 0; font-size: 11px;" x-text="'Planta: ' + (selectedQuoteForPDF.Planta || 'N/A')"></p>
              <p style="margin: 2px 0; font-size: 11px;" x-text="'Número de Parte: ' + (selectedQuoteForPDF.Numero_Parte || 'N/A')"></p>
              <p style="margin: 2px 0; font-size: 11px;" x-text="'Orden Compra (PO): ' + (selectedQuoteForPDF.PO_Referencia || 'Pendiente')"></p>
              <p style="margin: 2px 0; font-size: 11px;" x-text="'Estatus: ' + selectedQuoteForPDF.Estatus"></p>
            </div>
          </div>

          <!-- Items Table -->
          <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 12px;">
            <thead>
              <tr style="background-color: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left;">
                <th style="padding: 10px; font-weight: bold; color: #475569;">Concepto / Descripción</th>
                <th style="padding: 10px; font-weight: bold; color: #475569; text-align: right;">Cantidad (Pzs)</th>
                <th style="padding: 10px; font-weight: bold; color: #475569; text-align: right;">P.U. Estimado</th>
                <th style="padding: 10px; font-weight: bold; color: #475569; text-align: right;">Monto Autorizado</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom: 1px solid #f1f5f9;">
                <td style="padding: 12px 10px; font-weight: 500;">
                  Servicio de Inspección, Control y Sorteo de Calidad
                  <span style="display: block; font-size: 10px; color: #94a3b8; margin-top: 3px;" x-text="'No. Parte: ' + (selectedQuoteForPDF.Numero_Parte || 'N/A') + ' | Planta: ' + (selectedQuoteForPDF.Planta || 'N/A')"></span>
                </td>
                <td style="padding: 12px 10px; text-align: right; font-family: monospace;" x-text="selectedQuoteForPDF.Piezas_Autorizadas || 0"></td>
                <td style="padding: 12px 10px; text-align: right; font-family: monospace;" x-text="formatCurrency((selectedQuoteForPDF.Monto_Autorizado / (selectedQuoteForPDF.Piezas_Autorizadas || 1)))"></td>
                <td style="padding: 12px 10px; text-align: right; font-family: monospace; font-weight: bold;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado)"></td>
              </tr>
            </tbody>
          </table>

          <!-- Totals -->
          <div style="display: flex; justify-content: flex-end; margin-bottom: 30px;">
            <div style="width: 250px; border-top: 2px solid #e2e8f0; padding-top: 10px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px;">
                <span>Subtotal:</span>
                <span style="font-family: monospace;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado)"></span>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px;">
                <span>I.V.A. (16%):</span>
                <span style="font-family: monospace;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado * 0.16)"></span>
              </div>
              <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; color: #1e293b; border-top: 1px solid #f1f5f9; padding-top: 6px;">
                <span>Total (MXN):</span>
                <span style="font-family: monospace;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado * 1.16)"></span>
              </div>
            </div>
          </div>

          <!-- Notes & Terms -->
          <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; font-size: 10px; line-height: 1.5; color: #64748b;">
            <h4 style="margin-top: 0; margin-bottom: 8px; font-size: 11px; font-weight: bold; color: #475569; text-transform: uppercase;">Notas, Políticas y Condiciones</h4>
            <div style="white-space: pre-wrap;" x-text="selectedQuoteForPDF.Notas_Politicas || '-' "></div>
          </div>

          <!-- Signatures -->
          <div style="display: flex; justify-content: space-around; margin-top: 50px; text-align: center; font-size: 11px;">
            <div style="width: 200px; border-top: 1px solid #cbd5e1; padding-top: 8px;">
              <p style="margin: 0; font-weight: bold; color: #475569;">Best Quality Solutions</p>
              <p style="margin: 2px 0 0 0; color: #94a3b8;">Representante Autorizado</p>
            </div>
            <div style="width: 200px; border-top: 1px solid #cbd5e1; padding-top: 8px;">
              <p style="margin: 0; font-weight: bold; color: #475569;" x-text="selectedQuoteForPDFClient.Nombre_Fiscal || selectedQuoteForPDFClient.Nombre_Comercial"></p>
              <p style="margin: 2px 0 0 0; color: #94a3b8;">Aceptación de Cliente</p>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- LÓGICA ALPINE.JS -->
  <script src="app.js?v=202608172131"></script>
</body>
</html>
