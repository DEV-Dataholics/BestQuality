<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Ejecutivo BQS</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%230b4f9e%22/><text y=%2268%22 x=%2212%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 font-family=%22sans-serif%22>BQS</text></svg>">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- HTML2PDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bqs: {
              DEFAULT: '#0b4f9e',
              hover: '#08407f',
              soft: '#eaf2fb'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-900" x-data="bqsApp" x-init="init()" x-cloak>

  <!-- PANTALLA DE LOGIN -->
  <template x-if="!isLoggedIn">
    <div class="flex min-h-screen bg-slate-50">
      <!-- PANEL IZQUIERDO: Branding & Info -->
      <div class="hidden lg:flex lg:w-1/2 flex-col justify-between bg-gradient-to-br from-[#0a488f] via-[#0b4f9e] to-[#062c5b] text-white p-16 relative overflow-hidden">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
          <span class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 text-white text-base font-bold tracking-wider border border-white/20">BQS</span>
          <div>
            <p class="font-bold text-base leading-tight">Portal Ejecutivo BQS</p>
            <p class="text-xs text-blue-200">by Dataholics</p>
          </div>
        </div>

        <!-- Headline & Features -->
        <div class="max-w-md my-auto space-y-12">
          <div class="space-y-4">
            <h2 class="text-4xl font-bold tracking-tight leading-tight">Tu información financiera, consolidada y bajo control.</h2>
            <p class="text-blue-100 text-base leading-relaxed">El portal de lectura de la Dirección General: del dato disperso a una sola fuente de verdad.</p>
          </div>

          <div class="space-y-6">
            <!-- Feature 1 -->
            <div class="flex gap-4">
              <span class="p-2.5 h-10 w-10 shrink-0 rounded-xl bg-white/10 flex items-center justify-center border border-white/10 text-white">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" /></svg>
              </span>
              <div>
                <h4 class="font-semibold text-sm">Las tres preguntas, al instante</h4>
                <p class="text-xs text-blue-100 mt-0.5">Qué se facturó, qué falta por facturar y cuánto te deben — en un solo vistazo.</p>
              </div>
            </div>

            <!-- Feature 2 -->
            <div class="flex gap-4">
              <span class="p-2.5 h-10 w-10 shrink-0 rounded-xl bg-white/10 flex items-center justify-center border border-white/10 text-white">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M12 16v1" /></svg>
              </span>
              <div>
                <h4 class="font-semibold text-sm">Ciclo de cobro completo</h4>
                <p class="text-xs text-blue-100 mt-0.5">Del devengado a la factura y al pago, con reglas y trazabilidad de extremo a extremo.</p>
              </div>
            </div>

            <!-- Feature 3 -->
            <div class="flex gap-4">
              <span class="p-2.5 h-10 w-10 shrink-0 rounded-xl bg-white/10 flex items-center justify-center border border-white/10 text-white">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
              </span>
              <div>
                <h4 class="font-semibold text-sm">Seguridad por diseño</h4>
                <p class="text-xs text-blue-100 mt-0.5">Whitelist de accesos y perfil de Dirección en estricta solo lectura.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between text-xs text-blue-200">
          <span class="flex items-center gap-1.5"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg> Dirección en solo lectura</span>
          <span class="flex items-center gap-1.5"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg> Demo · datos simulados</span>
        </div>
      </div>

      <!-- PANEL DERECHO: Formulario de Login -->
      <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-slate-50">
        <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-10 shadow-sm space-y-8">
          <!-- Semillas de Base de Datos -->
          <div class="flex gap-4 pb-4 border-b border-slate-100">
            <button @click="seedDatabase()" class="flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 py-2.5 px-4 text-xs font-semibold text-indigo-700 transition duration-150">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
              Generar Seed
            </button>
            <button @click="clearDatabase()" class="flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-red-50 hover:bg-red-100 py-2.5 px-4 text-xs font-semibold text-red-600 transition duration-150">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
              Borrar Seed
            </button>
          </div>

          <div>
            <h3 class="text-2xl font-bold text-slate-900">Iniciar sesión</h3>
            <p class="text-sm text-slate-500 mt-1">Ingresa con tu correo authorized para continuar.</p>
          </div>

          <form class="space-y-6" @submit.prevent="handleLogin()">
            <div class="space-y-2">
              <label for="email" class="block text-sm font-semibold text-slate-700">Correo</label>
              <input id="email" x-model="loginEmail" type="email" required placeholder="admin@bestqualitysolutions.com" class="block w-full rounded-xl border border-slate-200 bg-white py-3 px-4 text-slate-900 focus:outline-none focus:border-bqs focus:ring-2 focus:ring-bqs/10 sm:text-sm">
            </div>

            <div class="space-y-2">
              <label for="password" class="block text-sm font-semibold text-slate-700">Contraseña</label>
              <input id="password" type="password" value="password" disabled class="block w-full rounded-xl border border-slate-200 bg-slate-50 py-3 px-4 text-slate-400 font-mono tracking-widest sm:text-sm">
              <p class="text-xs text-slate-400 mt-1">En el demo la contraseña no se valida.</p>
            </div>

            <template x-if="loginError">
              <div class="rounded-xl bg-red-50 border border-red-200 p-4 text-xs text-red-600" x-text="loginError"></div>
            </template>

            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-bqs hover:bg-bqs-hover py-3 text-sm font-semibold text-white shadow-sm transition duration-150">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
              Iniciar sesión
            </button>
          </form>

          <!-- Acceso rápido -->
          <div class="pt-6 border-t border-slate-100 space-y-3">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Acceso Rápido por Rol</span>
            <div class="grid grid-cols-1 gap-2">
              <button @click="loginEmail = 'admin@bestqualitysolutions.com'" class="flex items-center justify-between text-left p-3.5 rounded-xl border border-slate-100 hover:bg-slate-50 transition duration-150">
                <div>
                  <span class="text-xs font-bold text-slate-700 block">Admin Dataholics</span>
                  <span class="text-[11px] text-slate-400 block mt-0.5">Ve todo el sistema</span>
                </div>
                <span class="text-xs font-semibold text-slate-400" style="font-family: monospace;">admin@bestqualitysolutions.com</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>


  <!-- PORTAL PRINCIPAL (SPA) -->
  <template x-if="isLoggedIn">
    <div class="flex h-screen overflow-hidden">
      <!-- OVERLAY BACKDROP MÓVIL (Mobile-First) -->
      <div 
        x-show="mobileMenuOpen" 
        @click="mobileMenuOpen = false" 
        x-transition:enter="transition-opacity ease-linear duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition-opacity ease-linear duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 lg:hidden" 
        style="display: none;"
      ></div>

      <!-- SIDEBAR & DRAWER (Colapsable en Desktop, Off-Canvas en Celular) -->
      <aside 
        :class="[
          mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0',
          isSidebarCollapsed ? 'lg:w-0 lg:border-r-0' : 'lg:w-64 lg:border-r lg:border-slate-200'
        ]" 
        class="fixed inset-y-0 left-0 z-50 w-72 bg-white flex flex-col h-full shadow-2xl lg:shadow-none lg:static transition-all duration-300 overflow-hidden border-r border-slate-200 flex-shrink-0"
      >
        <div class="h-14 sm:h-16 flex items-center justify-between border-b border-slate-200 px-5 flex-shrink-0">
          <div class="flex items-center gap-3">
            <span class="w-9 h-9 flex items-center justify-center rounded-xl bg-bqs text-white text-sm font-black tracking-wider shadow-sm">BQS</span>
            <div>
              <p class="font-bold text-sm text-slate-900 leading-tight">Portal Ejecutivo</p>
              <p class="text-[11px] text-slate-400">by Dataholics</p>
            </div>
          </div>
          <!-- Botón Cerrar Drawer Móvil -->
          <button @click="mobileMenuOpen = false" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition" aria-label="Cerrar menú">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>

        <nav class="flex-1 p-3 sm:p-4 space-y-5 overflow-y-auto">
          <!-- Grupo Dirección -->
          <div>
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Dirección</p>
            <div class="space-y-1">
              <button @click="navigate('resumen')" :class="activePage === 'resumen' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                <span>Resumen / KPIs</span>
              </button>
              <button @click="navigate('porcobrar')" :class="activePage === 'porcobrar' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M12 16v1" /></svg>
                <span>Cuentas por Cobrar</span>
              </button>
            </div>
          </div>

          <!-- Grupo Catálogos & Operación -->
          <div>
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Catálogos & Operación</p>
            <div class="space-y-1">
              <button @click="navigate('clientes')" :class="activePage === 'clientes' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                <span>Clientes (UID)</span>
              </button>
              <button @click="navigate('cotizaciones')" :class="activePage === 'cotizaciones' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                <span>Cotizaciones & Remisiones</span>
              </button>
              <button @click="navigate('devengado')" :class="activePage === 'devengado' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
                <span>Devengado (Sorteos)</span>
              </button>
              <button @click="navigate('facturas')" :class="activePage === 'facturas' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                <span>Control de Facturas</span>
              </button>
              <button @click="navigate('pagos')" :class="activePage === 'pagos' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
                <span>Pagos & Abonos</span>
              </button>
            </div>
          </div>

          <!-- Grupo Herramientas -->
          <div>
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Herramientas</p>
            <div class="space-y-1">
              <button @click="navigate('importar')" :class="activePage === 'importar' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                <span>Carga Rápida (CSV/XML)</span>
              </button>
              <template x-if="userRole === 'admin' || userRole === 'owner'">
                <button @click="navigate('logs')" :class="activePage === 'logs' ? 'bg-bqs-soft text-bqs font-bold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition duration-150">
                  <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                  <span>Bitácora & Logs</span>
                </button>
              </template>
            </div>
          </div>
        </nav>

        <div class="p-4 border-t border-slate-200">
          <button @click="handleLogout()" class="w-full flex items-center justify-center gap-2 rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold text-red-600 hover:bg-red-50 hover:border-red-100 transition duration-150">
            Cerrar Sesión
          </button>
        </div>
      </aside>

      <!-- SECCIÓN PRINCIPAL -->
      <div class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-hidden">
        <!-- TOPBAR (Mobile-First) -->
        <header class="h-14 sm:h-16 bg-white border-b border-slate-200 flex items-center justify-between px-3 sm:px-6 lg:px-8 flex-shrink-0">
          <div class="flex items-center min-w-0">
            <!-- Botón Hamburguesa Móvil (Abre Drawer) -->
            <button @click="mobileMenuOpen = true" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 focus:outline-none mr-2 transition" aria-label="Abrir menú">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <!-- Botón Collapse Desktop -->
            <button @click="toggleSidebar()" class="hidden lg:inline-flex p-2 rounded-xl text-slate-500 hover:bg-slate-100 focus:outline-none mr-4 transition" aria-label="Toggle Sidebar">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <h1 class="text-sm sm:text-lg font-bold text-slate-800 truncate" x-text="getPageTitle()"></h1>
          </div>
          <div class="flex items-center gap-2.5">

                                </label>
                              </div>
                            </td>
                            <td class="py-3 text-center">

            <tr style="border-bottom: 1.5px solid #000; background-color: #f8fafc;">
              <th style="padding: 4px 8px; font-weight: bold; text-align: center; width: 80%;" x-text="tQuote('activity')">ACTIVITY</th>
              <th style="border-left: 1.5px solid #000; padding: 4px 8px; font-weight: bold; text-align: center; width: 20%;" x-text="tQuote('total_price')">Total Price</th>
            </tr>
            <tr>
              <td style="padding: 6px 12px;">
                <div style="display: flex; justify-content: space-around; align-items: center; font-size: 10px; font-weight: bold;">
                  <span>SORTING <span style="display: inline-block; width: 14px; height: 14px; border: 1px solid #000; vertical-align: middle; text-align: center; line-height: 14px; margin-left: 4px;">X</span></span>
                  <span>REWORK <span style="display: inline-block; width: 14px; height: 14px; border: 1px solid #000; vertical-align: middle; text-align: center; line-height: 14px; margin-left: 4px;"></span></span>
                  <span>OTHER (EXPLAIN) <span style="display: inline-block; width: 14px; height: 14px; border: 1px solid #000; vertical-align: middle; text-align: center; line-height: 14px; margin-left: 4px;"></span></span>
                </div>
              </td>
              <td style="border-left: 1.5px solid #000; padding: 6px 8px; text-align: right; font-weight: bold; font-family: monospace; font-size: 12px;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado)"></td>
            </tr>
          </table>

          <!-- 1. DESCRIPTION JOB / 2. LOCATION / 3. QUANTITY / DATES / COMMENTS -->
          <div style="border: 1.5px solid #000; border-top: none; padding: 8px 10px; font-size: 10.5px;">
            <div style="margin-bottom: 6px;">
              <strong style="color: #1d4ed8;" x-text="tQuote('desc_job')">1. DESCRIPTION JOB</strong>
              <div style="padding-left: 15px; margin-top: 2px;" x-text="selectedQuoteForPDF.Notas_Politicas || 'Servicio de Inspección, Control y Sorteo de Calidad'"></div>
            </div>
            
            <div style="margin-bottom: 6px;">
              <strong style="color: #1d4ed8;" x-text="tQuote('location')">2. LOCATION</strong>
              <div style="padding-left: 15px; margin-top: 2px;" x-text="selectedQuoteForPDF.Planta || 'Instalaciones BQS / En Planta'"></div>
            </div>

            <div style="margin-bottom: 8px;">
              <strong style="color: #1d4ed8;" x-text="tQuote('quantity')">3. QUANTITY</strong>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-left: 15px;">
                <table style="width: 55%; border: 1px solid #000; border-collapse: collapse; font-size: 9.5px; text-align: center;">
                  <tr style="background-color: #f1f5f9;">
                    <th style="border: 1px solid #000; padding: 3px;" x-text="tQuote('part_number_col')">Part Number</th>
                    <th style="border: 1px solid #000; padding: 3px;" x-text="tQuote('quantity_col')">Quantity</th>
                    <th style="border: 1px solid #000; padding: 3px;" x-text="tQuote('total_col')">TOTAL</th>
                  </tr>
                  <tr>
                    <td style="border: 1px solid #000; padding: 3px;" x-text="selectedQuoteForPDF.Numero_Parte || 'TBD'"></td>
                    <td style="border: 1px solid #000; padding: 3px;" x-text="selectedQuoteForPDF.Piezas_Autorizadas || 0"></td>
                    <td style="border: 1px solid #000; padding: 3px; font-weight: bold;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado)"></td>
                  </tr>
                </table>
                <div style="text-align: right; width: 40%;">
                  <span style="color: #dc2626; font-weight: bold; font-size: 11px;" x-text="tQuote('total_charge') + ': '">TOTAL CHARGE: </span>
                  <span style="font-weight: bold; font-family: monospace; font-size: 13px;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado)"></span>
                </div>
              </div>
            </div>

            <div style="margin-bottom: 4px;">
              <strong style="color: #1d4ed8;" x-text="tQuote('start_date')">2. START DATE:</strong>
              <span style="padding-left: 8px;" x-text="tQuote('from_auth')">From Authorization</span>
            </div>

            <div style="margin-bottom: 6px;">
              <strong style="color: #1d4ed8;" x-text="tQuote('finish_date')">3. FINISH DATE:</strong>
              <span style="padding-left: 8px;">Al agotar piezas autorizadas o notificación del cliente</span>
            </div>

            <div style="margin-bottom: 4px;">
              <strong style="color: #1d4ed8;" x-text="tQuote('comments')">4. ADDITIONAL COMMENTS:</strong>
              <div style="padding-left: 15px; margin-top: 2px; font-weight: bold; color: #b91c1c; font-size: 10px;" x-text="tQuote('comments_text')"></div>
            </div>
          </div>

          <!-- ADDITIONAL CHARGES & TOTAL COST -->
          <div style="border: 1.5px solid #000; border-top: none; font-size: 9.5px;">
            <div style="background-color: #f1f5f9; padding: 3px 8px; font-weight: bold; color: #1d4ed8;" x-text="tQuote('additional_charges')">ADITIONAL CHARGES</div>
            <div style="padding: 4px 8px; line-height: 1.35;">
              <div x-text="tQuote('supervisory_fee')">Supervisory Fee: Included.</div>
              <div x-text="tQuote('transport_fee')">Transportation Fee: IN CASE MATERIAL HAS TO BE TRANSPORTED TO BQS FACILITIES AN EXTRA</div>
              <div x-text="tQuote('personnel_transport')">Personnel Transportation: Included.</div>
              <div x-text="tQuote('special_tooling')">Special Tooling, Equipment or Material for the Event: Not Included.</div>
              <div>Others: -</div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1.5px solid #000; padding: 6px 12px; background-color: #f8fafc;">
              <div>
                <span style="font-weight: bold; font-size: 11.5px;" x-text="tQuote('total_cost') + ': '">TOTAL COST: </span>
                <span style="font-weight: 800; font-size: 14px; font-family: monospace;" x-text="formatCurrency(selectedQuoteForPDF.Monto_Autorizado)"></span>
              </div>
              <div style="font-size: 8.5px; font-style: italic; color: #64748b;" x-text="tQuote('quote_validity')">
                This quote is subject to revision 7 days from the above date.
              </div>
            </div>
          </div>

          <!-- TERMS AND CONDITIONS (Official BQS Policy) -->
          <div style="margin-top: 8px; font-size: 8px; line-height: 1.25; color: #334155;">
            <div style="text-align: center; font-weight: bold; color: #1d4ed8; margin-bottom: 3px;" x-text="tQuote('terms_header')">TERMS AND CONDITIONS</div>
            <p style="margin: 1px 0;"><strong>*** 1.</strong> BQS will charge a minimum daily rate for sorting or reworks of less than standard operational shifts to cover operational costs.</p>
            <p style="margin: 1px 0;"><strong>2.</strong> Upon acceptance of costs and/or standards (rates) given, no changes will be accepted without new terms/standards (rates) established and agreed upon by both parties in writing.</p>
            
            <div style="margin-top: 3px;">
              <strong x-text="tQuote('bqs_responsibilities')">BQS Responsibilities:</strong>
              <div style="padding-left: 6px;">a) Daily inspection reports & graphics | b) Work instructions | c) Supervision | d) A trilateral communication between supplier-BQS-client</div>
            </div>

            <div style="margin-top: 3px;">
              <strong x-text="tQuote('client_responsibilities')">CLIENT Responsibilities:</strong>
              <div style="padding-left: 6px;">a) Work instructions, qty. to sort, defective material photos. | b) Company’s complete name, billing & mailing address, phone, and accounts payable contact.</div>
            </div>

            <div style="margin-top: 3px;">
              <strong x-text="tQuote('warranties')">Warranties:</strong>
              <div style="padding-left: 6px;">a) BQS is a company that carries out quality sortings and rework services and is only responsible for failed inspections where guarantee is limited to material reinspection. Services do not cover field impact. | b) Client will notify problem in writing. | c) Client will provide defect evidence (Tracking Label and Defective Part).</div>
            </div>

            <div style="margin-top: 3px;">
              <strong x-text="tQuote('idle_time')">Idle Time (Non Productive Hours apply when):</strong>
              <div style="padding-left: 6px;">1) Personnel are at plant and material has not been provided. | 2) Personnel must wait for plant authorization. | 3) Defect criteria has not been established between Client and Supplier.</div>
            </div>
          </div>

          <!-- Signatures & Official Form Code -->
          <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; font-size: 9px; border-top: 1px solid #94a3b8; padding-top: 6px;">
            <div style="width: 48%;">
              <span x-text="tQuote('auth_signature')">I, ___________________________ authorize the quote established above</span>
            </div>
            <div style="width: 26%; text-align: center;">
              <span x-text="tQuote('signature') + ' ___________________________'">Signature: ___________________________</span>
            </div>
            <div style="width: 24%; text-align: right; font-weight: bold; color: #475569;" x-text="tQuote('doc_code')">
              FRM BQS-08-01-C Rev. Feb 08, 2019
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
  <!-- MODAL: INSPECCIONAR DETALLE DE AUDITORÍA -->
  <div x-show="logsData.inspectingLog" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm" style="display: none;">
    <div class="bg-white rounded-3xl max-w-xl w-full p-6 border border-slate-200 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h3 class="text-base font-bold text-slate-900">Detalle de Evento</h3>
          <p class="text-xs text-slate-500 font-mono" x-text="logsData.inspectingLog?.modulo + ' - ' + logsData.inspectingLog?.accion"></p>
        </div>
        <button @click="closeInspectLog()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
      </div>
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-1" x-text="logsData.inspectingLog?.descripcion"></p>
        <pre class="p-4 bg-slate-900 text-emerald-400 rounded-2xl text-xs font-mono overflow-auto max-h-96 leading-relaxed" x-text="JSON.stringify(JSON.parse(logsData.inspectingLog?.detalles_json || '{}'), null, 2)"></pre>
      </div>
      <div class="flex justify-end pt-2">
        <button @click="closeInspectLog()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-semibold text-slate-700 hover:bg-slate-200 transition">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <!-- LÓGICA ALPINE.JS -->
  <script src="app.js?v=202610011130"></script>
</body>
</html>
